<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>Focus · Distraction Tracker</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery -->

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    body {
      background: #f1f5f9;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .card-light {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }
    .card-light:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .badge-cat {
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 0.25rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      display: inline-block;
      min-height: 28px;
    }
    .cat-telegram { background: #dbeafe; color: #1e40af; }
    .cat-tiktok { background: #fce7f3; color: #9d174d; }
    .cat-adult { background: #fee2e2; color: #991b1b; }
    .cat-social { background: #e0e7ff; color: #4338ca; }
    .cat-other { background: #e2e8f0; color: #334155; }

    .filter-btn {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      transition: 0.15s ease;
      font-size: 0.7rem;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      min-height: 32px;
      touch-action: manipulation;
    }
    .filter-btn.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
    .filter-btn:hover {
      background: #e2e8f0;
    }
    .filter-btn.active:hover {
      background: #4338ca;
    }

    .quick-btn {
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 1rem;
      transition: all 0.1s ease;
      text-align: center;
      flex: 1 0 auto;
      min-width: 70px;
      min-height: 52px;
      border: 1px solid transparent;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      border-color: #e2e8f0;
    }
    .quick-btn:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }
    .quick-btn:active {
      transform: scale(0.94);
    }
    .quick-btn i {
      margin-right: 6px;
      font-size: 1rem;
    }
    .quick-btn.cat-telegram:hover { background: #dbeafe; border-color: #93c5fd; }
    .quick-btn.cat-tiktok:hover { background: #fce7f3; border-color: #f9a8d4; }
    .quick-btn.cat-adult:hover { background: #fee2e2; border-color: #fca5a5; }
    .quick-btn.cat-social:hover { background: #e0e7ff; border-color: #a5b4fc; }
    .quick-btn.cat-other:hover { background: #e2e8f0; border-color: #cbd5e1; }

    @media (max-width: 480px) {
      .quick-btn {
        font-size: 0.7rem;
        padding: 0.6rem 0.5rem;
        min-width: 55px;
        min-height: 44px;
      }
      .quick-btn i {
        font-size: 0.85rem;
        margin-right: 4px;
      }
    }

    .sync-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .sync-online { background: #22c55e; box-shadow: 0 0 12px #22c55e66; }
    .sync-offline { background: #ef4444; box-shadow: 0 0 12px #ef444466; }
    .sync-syncing { background: #f59e0b; box-shadow: 0 0 12px #f59e0b66; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .log-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      transition: all 0.2s ease;
      min-height: 60px;
    }
    .log-card:hover {
      background: #f1f5f9;
    }
    .log-card .log-time {
      font-size: 0.7rem;
      color: #64748b;
    }
    .log-card .log-note {
      font-size: 0.85rem;
      color: #1e293b;
      margin-top: 4px;
      word-break: break-word;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    input, select, textarea {
      font-size: 16px !important;
      min-height: 48px;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #4f46e5;
      outline-offset: 1px;
    }

    button, .btn-like {
      min-height: 44px;
      touch-action: manipulation;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .mobile-log-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    @media (min-width: 768px) {
      .mobile-log-list {
        display: none;
      }
    }

    .desktop-log-table {
      display: none;
    }
    @media (min-width: 768px) {
      .desktop-log-table {
        display: table;
      }
    }

    .scroll-container {
      max-height: 55vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-container::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-container::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .scroll-container::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }

    .stat-number {
      font-size: 1.5rem;
      line-height: 1.2;
    }
    @media (min-width: 768px) {
      .stat-number {
        font-size: 1.875rem;
      }
    }

    .table-row-hover:hover {
      background: #f8fafc;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.35s ease;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .modal-header {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    .modal-message {
      color: #475569;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .modal-btn {
      background: #4f46e5;
      color: white;
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1rem;
      min-height: 48px;
    }
    .modal-btn:hover {
      background: #4338ca;
    }

    /* Desktop 2-column layout */
    .desktop-grid {
      display: grid;
      gap: 1.5rem;
    }
    @media (min-width: 1024px) {
      .desktop-grid {
        grid-template-columns: 1fr 1.2fr;
      }
    }

    /* Desktop typography */
    @media (min-width: 1024px) {
      .desktop-title {
        font-size: 1.875rem !important;
        line-height: 2.25rem !important;
      }
      .desktop-stat {
        font-size: 2.25rem !important;
        line-height: 2.5rem !important;
      }
      .desktop-btn {
        font-size: 1rem !important;
        padding: 0.75rem 1.25rem !important;
        min-height: 56px !important;
      }
      .desktop-table {
        font-size: 0.95rem !important;
      }
      .desktop-table th,
      .desktop-table td {
        padding: 0.75rem 0.5rem !important;
      }
      .desktop-badge {
        font-size: 0.8rem !important;
        padding: 0.35rem 1rem !important;
        min-height: 32px !important;
      }
      .desktop-heading {
        font-size: 1.1rem !important;
      }
      .desktop-filter {
        font-size: 0.8rem !important;
        padding: 0.5rem 1rem !important;
        min-height: 38px !important;
      }
      .desktop-input {
        font-size: 1rem !important;
        min-height: 56px !important;
        padding: 0.75rem 1.25rem !important;
      }
      .desktop-quick-btn {
        font-size: 0.95rem !important;
        padding: 0.9rem 1.25rem !important;
        min-height: 56px !important;
      }
    }
  </style>
</head>

<div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 md:py-8 text-slate-800">

  <!-- HEADER -->

      <p class="text-slate-500 text-xs lg:text-sm mt-0.5 flex flex-wrap items-center gap-2">
        <span>zero‑friction · private</span>

    </div>
    <div class="flex items-center gap-2 md:gap-3">

      </div>
    </div>
  </header>

        <form id="logForm" class="w-full">

            <i class="fas fa-trash-can"></i> <span class="hidden xs:inline">Clear</span>

        </div>
      </div>

      <div class="scroll-container" id="logContainer">
        <!-- Desktop Table -->

          <table class="w-full text-sm lg:text-base desktop-table">
            <thead class="text-left text-xs lg:text-sm text-slate-500 border-b border-slate-200">
              <tr>
                <th class="pb-2 pr-2 font-medium">Time</th>
                <th class="pb-2 pr-2 font-medium">Category</th>
                <th class="pb-2 pr-2 font-medium">Note</th>
                <th class="pb-2 text-right font-medium">Action</th>
              </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
          </table>
        </div>

        <!-- Mobile Cards -->

        <!-- Empty state -->

          <i class="fas fa-inbox text-3xl lg:text-4xl block mb-2 text-slate-300"></i>
          No distractions logged. Stay in flow.
        </div>
      </div>
    </section>
  </div>
</div>

</div>

        header: 'Refocus Your Mind!',
        actions: [
          'လုပ်လက်စ အလုပ်ဆီ ချက်ချင်း ပြန်သွားပါ။ 10-Minute Focus Block စတင်လိုက်ပါ!'
        ]
      }
    };

    // ---------- STATE ----------
    let currentFilter = 'all';
    let logsCache = [];
    let isPosting = false;
    let isPolling = false;
    let isInitialized = false;
    let pollTimer = null;
    let retryCount = 0;

    // ---------- DOM REFS ----------
    const $syncDot = $('#syncDot');
    const $syncLabel = $('#syncLabel');
    const $totalToday = $('#totalToday');
    const $topDistractor = $('#topDistractor');
    const $focusStreak = $('#focusStreak');
    const $logTableBody = $('#logTableBody');
    const $mobileLogList = $('#mobileLogList');
    const $emptyState = $('#emptyState');
    const $detailInput = $('#detailInput');
    const $logForm = $('#logForm');
    const $modalOverlay = $('#actionModal');
    const $modalIcon = $('#modalIcon');
    const $modalHeader = $('#modalHeader');
    const $modalMessage = $('#modalMessage');
    const $modalCloseBtn = $('#modalCloseBtn');

    // ---------- MODAL FUNCTIONS ----------
    function showActionModal(category) {
      const config = ACTION_MESSAGES[category];
      if (!config) return;

      let actionMessage = config.actions[0];
      if (config.actions.length > 1) {
        const randomIndex = Math.floor(Math.random() * config.actions.length);
        actionMessage = config.actions[randomIndex];
      }

      $modalIcon.text(config.icon);
      $modalHeader.text(config.header);
      $modalMessage.text(actionMessage);
      $modalOverlay.addClass('active');
      $('body').css('overflow', 'hidden');
    }

    function closeModal() {
      $modalOverlay.removeClass('active');
      $('body').css('overflow', '');
      setTimeout(() => {
        $detailInput.focus();
      }, 100);
    }

    // Close modal on overlay click
    $modalOverlay.on('click', function(e) {
      if ($(e.target).is($modalOverlay)) {
        closeModal();
      }
    });

    // Close modal on button click
    $modalCloseBtn.on('click', function(e) {
      e.preventDefault();
      closeModal();
    });

    // Close modal on Escape key
    $(document).on('keydown', function(e) {
      if (e.key === 'Escape' && $modalOverlay.hasClass('active')) {
        closeModal();
      }
    });

    // ---------- SYNC STATUS ----------
    function setSyncStatus(state, message) {
      $syncDot.removeClass('sync-online sync-offline sync-syncing');
      if (state === 'online') {
        $syncDot.addClass('sync-online');
        $syncLabel.text(message || 'synced');
      } else if (state === 'syncing') {
        $syncDot.addClass('sync-syncing');
        $syncLabel.text(message || 'syncing...');
      } else {
        $syncDot.addClass('sync-offline');
        $syncLabel.text(message || 'offline');
      }
    }

    // ---------- LOCAL STORAGE ----------
    function loadLocalLogs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) { return []; }
    }
    function saveLocalLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    // ---------- HELPERS ----------
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function isToday(iso) {
      const d = new Date(iso);
      const now = new Date();
      return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }
    function generateId() {
      return Date.now() + '_' + Math.random().toString(36).substring(2, 7);
    }
    function getLogsHash(logs) {
      return JSON.stringify(logs.map(l => ({
        id: l.id,
        timestamp: l.timestamp,
        category: l.category,
        note: l.note
      })).sort((a, b) => a.id.localeCompare(b.id)));
    }

    function computeMetrics(logs) {
      const today = logs.filter(l => isToday(l.timestamp));
      const total = today.length;
      let freq = {}, maxCount = 0, top = '—';
      today.forEach(l => {
        freq[l.category] = (freq[l.category] || 0) + 1;
        if (freq[l.category] > maxCount) { maxCount = freq[l.category]; top = l.category; }
      });
      if (today.length === 0) top = '—';
      let streak = '—';
      if (logs.length > 0) {
        const sorted = [...logs].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        const last = new Date(sorted[0].timestamp);
        const diff = Math.floor((Date.now() - last.getTime()) / 60000);
        if (diff < 1) streak = '< 1 min';
        else if (diff < 60) streak = diff + ' min';
        else streak = Math.floor(diff/60) + 'h ' + (diff%60) + 'm';
      }
      return { total, top, streak };
    }

    // ---------- RENDER ----------
    function renderAll(animate = true) {
      const logs = logsCache;
      const sorted = [...logs].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      const metrics = computeMetrics(logs);

      $totalToday.text(metrics.total);
      $topDistractor.text(metrics.top);
      $focusStreak.text(metrics.streak);

      let filtered = sorted;
      if (currentFilter !== 'all') {
        filtered = sorted.filter(l => l.category === currentFilter);
      }

      $logTableBody.empty();
      $mobileLogList.empty();

      if (filtered.length === 0) {
        $emptyState.show();
        return;
      }
      $emptyState.hide();

      filtered.forEach((log) => {
        const catClass = CATEGORY_MAP[log.category] || 'cat-other';
        const timeStr = formatTime(log.timestamp);
        const note = log.note || '';
        const row = $(`
          <tr class="border-b border-slate-100 table-row-hover transition" data-id="${log.id}">
            <td class="py-2.5 lg:py-3 pr-2 text-slate-500 text-xs lg:text-sm whitespace-nowrap">${timeStr}</td>
            <td class="py-2.5 lg:py-3 pr-2"><span class="badge-cat ${catClass} desktop-badge">${log.category}</span></td>
            <td class="py-2.5 lg:py-3 pr-2 text-slate-700 max-w-[140px] lg:max-w-[200px] truncate">${note || '—'}</td>
            <td class="py-2.5 lg:py-3 text-right">
              <button class="deleteBtn text-slate-400 hover:text-rose-500 transition px-3 py-1.5 min-h-[36px]" data-id="${log.id}">
                <i class="fas fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `);
        $logTableBody.append(row);
      });

      filtered.forEach((log, index) => {
        const catClass = CATEGORY_MAP[log.category] || 'cat-other';
        const timeStr = formatTime(log.timestamp);
        const note = log.note || '';
        const card = $(`
          <div class="log-card fade-in" data-id="${log.id}" style="animation-delay: ${index * 25}ms">
            <div class="flex items-start justify-between gap-2">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="badge-cat ${catClass}">${log.category}</span>
                  <span class="log-time">${timeStr}</span>
                </div>
                <p class="log-note">${note || '—'}</p>
              </div>
              <button class="deleteBtnMobile text-slate-400 hover:text-rose-500 transition px-3 py-1.5 flex-shrink-0 min-h-[36px]" data-id="${log.id}">
                <i class="fas fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        `);
        $mobileLogList.append(card);

        if (animate) {
          setTimeout(() => { card.addClass('show'); }, 20 + index * 25);
        } else {
          card.addClass('show');
        }
      });

      $('.deleteBtn, .deleteBtnMobile').off('click').on('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const id = $(this).data('id');
        deleteLogById(id);
      });
    }

    // ---------- CORE SYNC ENGINE ----------
    async function postToCloudflare(retryAttempt = 0) {
      if (isPosting) {
        console.log('⏳ POST already in progress, skipping');
        return false;
      }

      if (!isInitialized) {
        console.log('⏳ App not initialized, skipping POST');
        return false;
      }

      if (!Array.isArray(logsCache)) {
        console.warn('⚠️ logsCache is not an array, skipping POST');
        return false;
      }

      isPosting = true;
      setSyncStatus('syncing');

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(logsCache)
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' ' + response.statusText);
        }

        const result = await response.json();
        console.log('✅ POST success:', result);
        setSyncStatus('online');
        saveLocalLogs(logsCache);
        retryCount = 0;
        isPosting = false;
        return true;
      } catch (err) {
        console.error('❌ POST error:', err);
        setSyncStatus('offline', 'sync failed');
        isPosting = false;

        if (retryAttempt < MAX_RETRY_ATTEMPTS) {
          console.log(`🔄 Retry ${retryAttempt + 1}/${MAX_RETRY_ATTEMPTS} in ${RETRY_DELAY}ms...`);
          await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
          return postToCloudflare(retryAttempt + 1);
        }

        return false;
      }
    }

    async function getFromCloudflare() {
      try {
        const response = await fetch(WORKER_URL, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' ' + response.statusText);
        }

        const data = await response.json();

        if (data && data.logs && Array.isArray(data.logs)) {
          return data.logs;
        } else if (data && Array.isArray(data)) {
          return data;
        } else if (data && data.data && Array.isArray(data.data)) {
          return data.data;
        }
        return null;
      } catch (err) {
        console.warn('⚠️ GET error:', err);
        setSyncStatus('offline', 'fetch failed');
        return null;
      }
    }

    async function pollForUpdates() {
      if (isPolling) return;
      if (isPosting) return;
      if (!isInitialized) return;

      isPolling = true;

      try {
        const remoteLogs = await getFromCloudflare();

        if (remoteLogs && Array.isArray(remoteLogs)) {
          const localHash = getLogsHash(logsCache);
          const remoteHash = getLogsHash(remoteLogs);

          if (localHash !== remoteHash) {
            console.log('🔄 Remote data differs, updating local cache');
            logsCache = remoteLogs;
            saveLocalLogs(logsCache);
            renderAll(true);
            setSyncStatus('online');
          } else {
            if (document.visibilityState === 'visible') {
              setSyncStatus('online');
            }
          }
        }
      } catch (err) {
        console.warn('⚠️ Poll error:', err);
      } finally {
        isPolling = false;
      }
    }

    // ---------- CRUD OPERATIONS ----------
    async function addLog(category, note) {
      if (isPosting) {
        console.log('⏳ Sync in progress, please wait...');
        return;
      }

      const entry = {
        id: generateId(),
        timestamp: new Date().toISOString(),
        category: category,
        note: (note || '').trim() || ''
      };

      // 1. IMMEDIATE optimistic update
      logsCache.unshift(entry);
      saveLocalLogs(logsCache);
      renderAll(true);

      // 2. Show action modal
      if (category && ACTION_MESSAGES[category]) {
        showActionModal(category);
      }

      // 3. Clear input and maintain focus
      $detailInput.val('');
      $detailInput.focus();

      // 4. Async sync to Cloudflare with retry
      try {
        await postToCloudflare();
      } catch (err) {
        console.warn('⚠️ Background sync failed, data retained locally');
      }
    }

    async function deleteLogById(id) {
      const $row = $(`tr[data-id="${id}"]`);
      const $card = $(`.log-card[data-id="${id}"]`);

      const doDelete = () => {
        logsCache = logsCache.filter(l => l.id !== id);
        saveLocalLogs(logsCache);
        renderAll(true);

        postToCloudflare().catch(err => {
          console.warn('⚠️ Delete sync failed, data retained locally');
        });
      };

      if ($row.length) {
        $row.css({ opacity: 0, transform: 'scale(0.97)' });
        setTimeout(doDelete, 200);
      } else if ($card.length) {
        $card.css({ opacity: 0, transform: 'scale(0.95)' });
        setTimeout(doDelete, 200);
      } else {
        doDelete();
      }
    }

    async function clearAllLogs() {
      if (logsCache.length === 0) return;
      if (!confirm('Delete all distraction logs permanently?')) return;

      logsCache = [];
      saveLocalLogs(logsCache);
      renderAll(true);

      if (isInitialized) {
        setSyncStatus('syncing');
        try {
          const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(logsCache)
          });

          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }

          const result = await response.json();
          console.log('✅ Clear all sync success:', result);
          setSyncStatus('online');
          saveLocalLogs(logsCache);
        } catch (err) {
          console.error('❌ Clear all sync failed:', err);
          setSyncStatus('offline', 'sync failed');
        }
      }
    }

    // ---------- INITIALIZATION ----------
    async function initApp() {
      console.log('🚀 Initializing app...');

      logsCache = loadLocalLogs();
      renderAll(false);

      if (!WORKER_URL) {
        console.warn('⚠️ Worker URL not configured. Using local storage only.');
        setSyncStatus('offline', 'no endpoint');
        isInitialized = true;
        return;
      }

      setSyncStatus('syncing', 'connecting...');

      const remoteLogs = await getFromCloudflare();

      if (remoteLogs && Array.isArray(remoteLogs) && remoteLogs.length > 0) {
        console.log('📥 Loaded data from cloud:', remoteLogs.length, 'logs');
        logsCache = remoteLogs;
        saveLocalLogs(logsCache);
        renderAll(false);
        setSyncStatus('online');
      } else if (logsCache.length > 0) {
        console.log('📤 No remote data, pushing local data...');
        isInitialized = true;
        await postToCloudflare();
      } else {
        console.log('📭 No data found, starting fresh');
        setSyncStatus('online');
      }

      isInitialized = true;

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollForUpdates, POLL_INTERVAL);

      console.log('✅ App initialized successfully');
    }

    // ---------- EVENT BINDING ----------
    $(document).ready(function() {
      initApp();

      // Form submission prevention (critical for mobile)
      $logForm.on('submit', function(e) {
        e.preventDefault();
        return false;
      });

      // Quick log buttons with touch support
      $('#quickBtnGroup').on('click touchend', 'button', function(e) {
        e.preventDefault();
        const cat = $(this).data('cat');
        if (cat) {
          const note = $detailInput.val().trim();
          addLog(cat, note);
        }
        return false;
      });

      // Log with detail button
      $('#logWithDetailBtn').on('click touchend', function(e) {
        e.preventDefault();
        const note = $detailInput.val().trim();
        addLog('Other / Custom', note || 'manual log');
        return false;
      });

      // Enter key on detail input
      $detailInput.on('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const note = $(this).val().trim();
          addLog('Other / Custom', note || 'manual log');
          return false;
        }
      });

      // Filter buttons
      $('.filter-btn').on('click', function(e) {
        e.preventDefault();
        $('.filter-btn').removeClass('active');
        $(this).addClass('active');
        currentFilter = $(this).data('filter') || 'all';
        renderAll(true);
      });

      // Clear all
      $('#clearAllBtn').on('click touchend', function(e) {
        e.preventDefault();
        clearAllLogs();
        return false;
      });

      // Live clock
      function updateClock() {
        const now = new Date();
        $('#liveClock').text(now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }
      updateClock();
      setInterval(updateClock, 1000);

      $detailInput.focus();

      // Refresh on tab visibility change
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && isInitialized) {
          pollForUpdates();
        }
      });

      // Handle mobile network status changes
      window.addEventListener('online', function() {
        console.log('📶 Network online, attempting sync...');
        if (isInitialized && logsCache.length > 0) {
          postToCloudflare();
        }
      });

      window.addEventListener('offline', function() {
        console.log('📶 Network offline, data retained locally');
        setSyncStatus('offline', 'offline');
      });
    });

  })(jQuery);
</script>
</body>
</html>
