<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>Focus · Distraction Tracker (fixed 2)</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    body {
      background: #f1f5f9;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .card-light {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }
    .card-light:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .badge-cat {
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 0.25rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      display: inline-block;
      min-height: 28px;
    }
    .cat-telegram { background: #dbeafe; color: #1e40af; }
    .cat-tiktok { background: #fce7f3; color: #9d174d; }
    .cat-adult { background: #fee2e2; color: #991b1b; }
    .cat-social { background: #e0e7ff; color: #4338ca; }
    .cat-other { background: #e2e8f0; color: #334155; }

    .filter-btn {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      transition: 0.15s ease;
      font-size: 0.7rem;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      min-height: 32px;
      touch-action: manipulation;
    }
    .filter-btn.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
    .filter-btn:hover {
      background: #e2e8f0;
    }
    .filter-btn.active:hover {
      background: #4338ca;
    }

    .quick-btn {
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 1rem;
      transition: all 0.1s ease;
      text-align: center;
      flex: 1 0 auto;
      min-width: 70px;
      min-height: 52px;
      border: 1px solid transparent;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      border-color: #e2e8f0;
    }
    .quick-btn:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }
    .quick-btn:active {
      transform: scale(0.94);
    }
    .quick-btn i {
      margin-right: 6px;
      font-size: 1rem;
    }
    .quick-btn.cat-telegram:hover { background: #dbeafe; border-color: #93c5fd; }
    .quick-btn.cat-tiktok:hover { background: #fce7f3; border-color: #f9a8d4; }
    .quick-btn.cat-adult:hover { background: #fee2e2; border-color: #fca5a5; }
    .quick-btn.cat-social:hover { background: #e0e7ff; border-color: #a5b4fc; }
    .quick-btn.cat-other:hover { background: #e2e8f0; border-color: #cbd5e1; }

    @media (max-width: 480px) {
      .quick-btn {
        font-size: 0.7rem;
        padding: 0.6rem 0.5rem;
        min-width: 55px;
        min-height: 44px;
      }
      .quick-btn i {
        font-size: 0.85rem;
        margin-right: 4px;
      }
    }

    .sync-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .sync-online { background: #22c55e; box-shadow: 0 0 12px #22c55e66; }
    .sync-offline { background: #ef4444; box-shadow: 0 0 12px #ef444466; }
    .sync-syncing { background: #f59e0b; box-shadow: 0 0 12px #f59e0b66; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .log-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      transition: all 0.2s ease;
      min-height: 60px;
    }
    .log-card:hover {
      background: #f1f5f9;
    }
    .log-card .log-time {
      font-size: 0.7rem;
      color: #64748b;
    }
    .log-card .log-note {
      font-size: 0.85rem;
      color: #1e293b;
      margin-top: 4px;
      word-break: break-word;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    input, select, textarea {
      font-size: 16px !important;
      min-height: 48px;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #4f46e5;
      outline-offset: 1px;
    }

    button, .btn-like {
      min-height: 44px;
      touch-action: manipulation;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .mobile-log-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    @media (min-width: 768px) {
      .mobile-log-list {
        display: none;
      }
    }

    .desktop-log-table {
      display: none;
    }
    @media (min-width: 768px) {
      .desktop-log-table {
        display: table;
      }
    }

    .scroll-container {
      max-height: 55vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-container::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-container::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .scroll-container::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }

    .stat-number {
      font-size: 1.5rem;
      line-height: 1.2;
    }
    @media (min-width: 768px) {
      .stat-number {
        font-size: 1.875rem;
      }
    }

    .table-row-hover:hover {
      background: #f8fafc;
    }

    .delete-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>

<div class="max-w-5xl mx-auto px-4 py-4 md:py-8 text-slate-800">

  <!-- HEADER -->
  <header class="flex flex-wrap items-center justify-between mb-5 gap-2">
    <div>
      <h1 class="text-xl md:text-2xl font-semibold tracking-tight flex items-center gap-2 text-slate-900">
        <i class="fas fa-brain text-indigo-600 text-2xl"></i> Focus<span class="text-indigo-500">/</span>track
      </h1>
      <p class="text-slate-500 text-xs md:text-sm mt-0.5 flex flex-wrap items-center gap-2">
        <span>zero‑friction · private</span>
        <span class="bg-slate-100 text-slate-600 text-[0.6rem] px-2 py-0.5 rounded-full border border-slate-200 inline-flex items-center gap-1">
          <i class="fas fa-cloud text-indigo-500"></i> Cloudflare KV
        </span>
      </p>
    </div>
    <div class="flex items-center gap-2 md:gap-3">
      <div id="syncStatus" class="text-[10px] md:text-xs text-slate-600 bg-white px-2.5 md:px-3 py-1.5 rounded-full border border-slate-200 flex items-center gap-1.5 min-h-[32px] shadow-sm">
        <span class="sync-dot sync-offline" id="syncDot"></span>
        <span id="syncLabel" class="whitespace-nowrap">offline</span>
      </div>
      <div class="text-[10px] md:text-xs text-slate-600 bg-white px-2.5 md:px-3 py-1.5 rounded-full border border-slate-200 flex items-center gap-1.5 min-h-[32px] shadow-sm">
        <i class="far fa-clock text-indigo-500"></i> <span id="liveClock" class="font-mono text-slate-700"></span>
      </div>
    </div>
  </header>

  <!-- QUICK LOG SECTION -->
  <section class="card-light rounded-2xl p-4 md:p-5 mb-5 shadow-sm">
    <div class="flex flex-wrap items-center gap-1.5 mb-3">
      <span class="text-xs font-medium text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fas fa-bolt text-amber-500"></i> 1‑click log
      </span>
      <span class="text-[10px] text-slate-400 ml-1">(tap button → instant)</span>
    </div>

    <div class="flex flex-wrap gap-2 mb-3" id="quickBtnGroup">
      <button class="quick-btn cat-telegram" data-cat="Telegram Notifications"><i class="fab fa-telegram"></i> Telegram</button>
      <button class="quick-btn cat-tiktok" data-cat="TikTok / Short Videos"><i class="fab fa-tiktok"></i> TikTok</button>
      <button class="quick-btn cat-adult" data-cat="Adult Content / Pornography"><i class="fas fa-ban"></i> Adult</button>
      <button class="quick-btn cat-social" data-cat="Social Media / Browsing"><i class="fas fa-globe"></i> Social</button>
      <button class="quick-btn cat-other" data-cat="Other / Custom"><i class="fas fa-ellipsis"></i> Other</button>
    </div>

    <div class="flex flex-wrap items-center gap-2 mt-1">
      <div class="flex-1 min-w-[140px]">
        <input id="detailInput" type="text" placeholder="Optional note (e.g. 'scrolled 15m')" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:outline-none" autocomplete="off">
      </div>
      <button id="logWithDetailBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-3 rounded-xl transition flex items-center gap-1.5 touch-manipulation min-h-[48px] shadow-sm">
        <i class="fas fa-plus"></i> <span class="hidden sm:inline">Log with note</span><span class="sm:hidden">Log</span>
      </button>
    </div>
    <p class="text-[10px] text-slate-400 mt-2 flex items-center gap-1"><i class="far fa-clock"></i> timestamp auto‑captured</p>
  </section>

  <!-- DASHBOARD -->
  <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4 mb-5">
    <div class="card-light rounded-2xl p-3 md:p-4 flex items-center gap-3 min-h-[72px] shadow-sm">
      <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-lg flex-shrink-0"><i class="fas fa-list"></i></div>
      <div class="min-w-0">
        <p class="text-[10px] md:text-xs text-slate-500 font-medium">Today's interruptions</p>
        <p id="totalToday" class="stat-number font-bold text-slate-900">0</p>
      </div>
    </div>
    <div class="card-light rounded-2xl p-3 md:p-4 flex items-center gap-3 min-h-[72px] shadow-sm">
      <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 text-lg flex-shrink-0"><i class="fas fa-crown"></i></div>
      <div class="min-w-0">
        <p class="text-[10px] md:text-xs text-slate-500 font-medium">Top distractor</p>
        <p id="topDistractor" class="text-lg md:text-xl font-bold text-slate-900 truncate">—</p>
      </div>
    </div>
    <div class="card-light rounded-2xl p-3 md:p-4 flex items-center gap-3 min-h-[72px] shadow-sm">
      <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-lg flex-shrink-0"><i class="fas fa-stopwatch"></i></div>
      <div class="min-w-0">
        <p class="text-[10px] md:text-xs text-slate-500 font-medium">Focus streak (since last)</p>
        <p id="focusStreak" class="text-lg md:text-xl font-bold text-slate-900 truncate">—</p>
      </div>
    </div>
  </section>

  <!-- LOG HISTORY -->
  <section class="card-light rounded-2xl p-4 md:p-5 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h2 class="text-sm font-medium text-slate-600 uppercase tracking-wider flex items-center gap-2">
        <i class="fas fa-clock-rotate-left text-indigo-500"></i> History
      </h2>
      <div class="flex flex-wrap items-center gap-1.5">
        <button class="filter-btn active" data-filter="all">Alll</button>
        <button class="filter-btn" data-filter="Telegram Notifications">Telegram</button>
        <button class="filter-btn" data-filter="TikTok / Short Videos">TikTok</button>
        <button class="filter-btn" data-filter="Adult Content / Pornography">Adult</button>
        <button class="filter-btn" data-filter="Social Media / Browsing">Social</button>
        <button class="filter-btn" data-filter="Other / Custom">Other</button>
        <button id="clearAllBtn" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-full transition flex items-center gap-1 border border-rose-200 min-h-[32px]">
          <i class="fas fa-trash-can"></i> <span class="hidden xs:inline">Clear</span>
        </button>
      </div>
    </div>

    <div class="scroll-container" id="logContainer">
      <div class="desktop-log-table table-wrap">
        <table class="w-full text-sm">
          <thead class="text-left text-xs text-slate-500 border-b border-slate-200">
            <tr>
              <th class="pb-2 pr-2 font-medium">Time</th>
              <th class="pb-2 pr-2 font-medium">Category</th>
              <th class="pb-2 pr-2 font-medium">Note</th>
              <th class="pb-2 text-right font-medium">Action</th>
            </tr>
          </thead>
          <tbody id="logTableBody"></tbody>
        </table>
      </div>

      <div id="mobileLogList" class="mobile-log-list"></div>

      <div id="emptyState" class="text-center text-slate-400 text-sm py-8">
        <i class="fas fa-inbox text-3xl block mb-2 text-slate-300"></i>
        No distractions logged. Stay in flow.
      </div>
    </div>
  </section>
</div>

<script>
  // ================================================================
  //  ☁️  CLOUDFLARE WORKER CONFIGURATION
  // ================================================================
  const WORKER_URL = "https://distraction-api.aungthantzin2007.workers.dev";
  const STORAGE_KEY = 'focus_distraction_logs_cf';
  // ================================================================

  (function($) {
    "use strict";

    // ---------- CONSTANTS ----------
    const CATEGORY_MAP = {
      'Telegram Notifications': 'cat-telegram',
      'TikTok / Short Videos': 'cat-tiktok',
      'Adult Content / Pornography': 'cat-adult',
      'Social Media / Browsing': 'cat-social',
      'Other / Custom': 'cat-other'
    };
    const POLL_INTERVAL = 3500;

    // ---------- STATE ----------
    let currentFilter = 'all';
    let logsCache = [];
    let isPosting = false;
    let isPolling = false;
    let isInitialized = false;
    let pollTimer = null;

    // ---------- DOM REFS ----------
    const $syncDot = $('#syncDot');
    const $syncLabel = $('#syncLabel');
    const $totalToday = $('#totalToday');
    const $topDistractor = $('#topDistractor');
    const $focusStreak = $('#focusStreak');
    const $logTableBody = $('#logTableBody');
    const $mobileLogList = $('#mobileLogList');
    const $emptyState = $('#emptyState');
    const $detailInput = $('#detailInput');

    // ---------- SYNC STATUS ----------
    function setSyncStatus(state, message) {
      $syncDot.removeClass('sync-online sync-offline sync-syncing');
      if (state === 'online') {
        $syncDot.addClass('sync-online');
        $syncLabel.text(message || 'synced');
      } else if (state === 'syncing') {
        $syncDot.addClass('sync-syncing');
        $syncLabel.text(message || 'syncing...');
      } else {
        $syncDot.addClass('sync-offline');
        $syncLabel.text(message || 'offline');
      }
    }

    // ---------- LOCAL STORAGE ----------
    function loadLocalLogs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) { return []; }
    }
    function saveLocalLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    // ---------- HELPERS ----------
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function isToday(iso) {
      const d = new Date(iso);
      const now = new Date();
      return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }
    function generateId() {
      return Date.now() + '_' + Math.random().toString(36).substring(2, 7);
    }
    function getLogsHash(logs) {
      return JSON.stringify(logs.map(l => ({
        id: l.id,
        timestamp: l.timestamp,
        category: l.category,
        note: l.note
      })).sort((a, b) => a.id.localeCompare(b.id)));
    }

    function computeMetrics(logs) {
      const today = logs.filter(l => isToday(l.timestamp));
      const total = today.length;
      let freq = {}, maxCount = 0, top = '—';
      today.forEach(l => {
        freq[l.category] = (freq[l.category] || 0) + 1;
        if (freq[l.category] > maxCount) { maxCount = freq[l.category]; top = l.category; }
      });
      if (today.length === 0) top = '—';
      let streak = '—';
      if (logs.length > 0) {
        const sorted = [...logs].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        const last = new Date(sorted[0].timestamp);
        const diff = Math.floor((Date.now() - last.getTime()) / 60000);
        if (diff < 1) streak = '< 1 min';
        else if (diff < 60) streak = diff + ' min';
        else streak = Math.floor(diff/60) + 'h ' + (diff%60) + 'm';
      }
      return { total, top, streak };
    }

    // ---------- RENDER ----------
    function renderAll(animate = true) {
      const logs = logsCache;
      const sorted = [...logs].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      const metrics = computeMetrics(logs);

      $totalToday.text(metrics.total);
      $topDistractor.text(metrics.top);
      $focusStreak.text(metrics.streak);

      let filtered = sorted;
      if (currentFilter !== 'all') {
        filtered = sorted.filter(l => l.category === currentFilter);
      }

      $logTableBody.empty();
      $mobileLogList.empty();

      if (filtered.length === 0) {
        $emptyState.show();
        return;
      }
      $emptyState.hide();

      filtered.forEach((log) => {
        const catClass = CATEGORY_MAP[log.category] || 'cat-other';
        const timeStr = formatTime(log.timestamp);
        const note = log.note || '';
        const row = $(`
          <tr class="border-b border-slate-100 table-row-hover transition" data-id="${log.id}">
            <td class="py-2.5 pr-2 text-slate-500 text-xs whitespace-nowrap">${timeStr}</td>
            <td class="py-2.5 pr-2"><span class="badge-cat ${catClass}">${log.category}</span></td>
            <td class="py-2.5 pr-2 text-slate-700 max-w-[140px] truncate">${note || '—'}</td>
            <td class="py-2.5 text-right">
              <button class="deleteBtn text-slate-400 hover:text-rose-500 transition px-3 py-1.5 min-h-[36px]" data-id="${log.id}">
                <i class="fas fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `);
        $logTableBody.append(row);
      });

      filtered.forEach((log, index) => {
        const catClass = CATEGORY_MAP[log.category] || 'cat-other';
        const timeStr = formatTime(log.timestamp);
        const note = log.note || '';
        const card = $(`
          <div class="log-card fade-in" data-id="${log.id}" style="animation-delay: ${index * 25}ms">
            <div class="flex items-start justify-between gap-2">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="badge-cat ${catClass}">${log.category}</span>
                  <span class="log-time">${timeStr}</span>
                </div>
                <p class="log-note">${note || '—'}</p>
              </div>
              <button class="deleteBtnMobile text-slate-400 hover:text-rose-500 transition px-3 py-1.5 flex-shrink-0 min-h-[36px]" data-id="${log.id}">
                <i class="fas fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        `);
        $mobileLogList.append(card);

        if (animate) {
          setTimeout(() => { card.addClass('show'); }, 20 + index * 25);
        } else {
          card.addClass('show');
        }
      });

      $('.deleteBtn, .deleteBtnMobile').off('click').on('click', function(e) {
        e.stopPropagation();
        const id = $(this).data('id');
        deleteLogById(id);
      });
    }

    // ---------- CORE SYNC ENGINE ----------
    async function postToCloudflare() {
      if (isPosting) return false;
      if (!isInitialized) return false;
      if (!Array.isArray(logsCache)) return false;

      isPosting = true;
      setSyncStatus('syncing');

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(logsCache)
        });

        if (!response.ok) throw new Error('HTTP ' + response.status);

        const result = await response.json();
        console.log('✅ POST success:', result);
        setSyncStatus('online');
        saveLocalLogs(logsCache);
        isPosting = false;
        return true;
      } catch (err) {
        console.error('❌ POST error:', err);
        setSyncStatus('offline', 'sync failed');
        isPosting = false;
        return false;
      }
    }

    async function getFromCloudflare() {
      try {
        const response = await fetch(WORKER_URL, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) throw new Error('HTTP ' + response.status);

        const data = await response.json();
        if (data && data.logs && Array.isArray(data.logs)) return data.logs;
        else if (data && Array.isArray(data)) return data;
        else if (data && data.data && Array.isArray(data.data)) return data.data;
        return null;
      } catch (err) {
        console.warn('⚠️ GET error:', err);
        setSyncStatus('offline', 'fetch failed');
        return null;
      }
    }

    async function pollForUpdates() {
      if (isPolling || isPosting || !isInitialized) return;

      isPolling = true;
      try {
        const remoteLogs = await getFromCloudflare();
        if (remoteLogs && Array.isArray(remoteLogs)) {
          const localHash = getLogsHash(logsCache);
          const remoteHash = getLogsHash(remoteLogs);

          if (localHash !== remoteHash) {
            console.log('🔄 Remote data differs, updating local cache');
            logsCache = remoteLogs;
            saveLocalLogs(logsCache);
            renderAll(true);
            setSyncStatus('online');
          } else {
            if (document.visibilityState === 'visible') {
              setSyncStatus('online');
            }
          }
        }
      } catch (err) {
        console.warn('⚠️ Poll error:', err);
      } finally {
        isPolling = false;
      }
    }

    // ---------- CRUD OPERATIONS ----------
    async function addLog(category, note) {
      const entry = {
        id: generateId(),
        timestamp: new Date().toISOString(),
        category: category,
        note: (note || '').trim() || ''
      };

      logsCache.unshift(entry);
      saveLocalLogs(logsCache);
      renderAll(true);

      postToCloudflare();
      $detailInput.val('').focus();
    }

    async function deleteLogById(id) {
      const $row = $(`tr[data-id="${id}"]`);
      const $card = $(`.log-card[data-id="${id}"]`);

      const doDelete = () => {
        logsCache = logsCache.filter(l => l.id !== id);
        saveLocalLogs(logsCache);
        renderAll(true);
        postToCloudflare();
      };

      if ($row.length) {
        $row.css({ opacity: 0, transform: 'scale(0.97)' });
        setTimeout(doDelete, 200);
      } else if ($card.length) {
        $card.css({ opacity: 0, transform: 'scale(0.95)' });
        setTimeout(doDelete, 200);
      } else {
        doDelete();
      }
    }

    async function clearAllLogs() {
      if (logsCache.length === 0) return;
      if (!confirm('Delete all distraction logs permanently?')) return;

      logsCache = [];
      saveLocalLogs(logsCache);
      renderAll(true);

      if (isInitialized) {
        setSyncStatus('syncing');
        try {
          const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(logsCache)
          });

          if (!response.ok) throw new Error('HTTP ' + response.status);

          setSyncStatus('online');
          saveLocalLogs(logsCache);
        } catch (err) {
          console.error('❌ Clear all sync failed:', err);
          setSyncStatus('offline', 'sync failed');
        }
      }
    }

    // ---------- INITIALIZATION ----------
    async function initApp() {
      console.log('🚀 Initializing app...');

      logsCache = loadLocalLogs();
      renderAll(false);

      // FIX: URL Validation Logic Corrected
      if (!WORKER_URL) {
        console.warn('⚠️ Worker URL not configured.');
        setSyncStatus('offline', 'no endpoint');
        isInitialized = true;
        return;
      }

      setSyncStatus('syncing', 'connecting...');

      const remoteLogs = await getFromCloudflare();

      if (remoteLogs && Array.isArray(remoteLogs) && remoteLogs.length > 0) {
        console.log('📥 Loaded data from cloud:', remoteLogs.length, 'logs');
        logsCache = remoteLogs;
        saveLocalLogs(logsCache);
        renderAll(false);
        setSyncStatus('online');
      } else if (logsCache.length > 0) {
        console.log('📤 No remote data, pushing local data...');
        isInitialized = true;
        await postToCloudflare();
      } else {
        console.log('📭 No data found, starting fresh');
        setSyncStatus('online');
      }

      isInitialized = true;

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollForUpdates, POLL_INTERVAL);

      console.log('✅ App initialized successfully');
    }

    // ---------- EVENT BINDING ----------
    $(document).ready(function() {
      initApp();

      $('#quickBtnGroup').on('click', 'button', function() {
        const cat = $(this).data('cat');
        if (cat) {
          const note = $detailInput.val().trim();
          addLog(cat, note);
        }
      });

      $('#logWithDetailBtn').on('click', function() {
        const note = $detailInput.val().trim();
        addLog('Other / Custom', note || 'manual log');
      });

      $detailInput.on('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          $('#logWithDetailBtn').click();
        }
      });

      $('.filter-btn').on('click', function() {
        $('.filter-btn').removeClass('active');
        $(this).addClass('active');
        currentFilter = $(this).data('filter') || 'all';
        renderAll(true);
      });

      $('#clearAllBtn').on('click', function() {
        clearAllLogs();
      });

      function updateClock() {
        const now = new Date();
        $('#liveClock').text(now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }
      updateClock();
      setInterval(updateClock, 1000);

      $detailInput.focus();

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && isInitialized) {
          pollForUpdates();
        }
      });
    });

  })(jQuery);
</script>
</body>
</html>
