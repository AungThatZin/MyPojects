<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>🔒 Focus · distraction tracker (cloud sync)</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- ============ FIREBASE SDK (modular CDN) ============ -->
  <!-- Firebase App (core) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <!-- Firebase Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    body { background: #0b0f17; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .card-dark { background: #141a26; border: 1px solid #2a3344; transition: box-shadow 0.15s ease, transform 0.1s ease; }
    .card-dark:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    .badge-cat { font-weight: 500; letter-spacing: 0.01em; padding: 0.2rem 0.8rem; border-radius: 9999px; font-size: 0.7rem; }
    .cat-telegram { background: #2b6f9e; color: #e8f0fe; }
    .cat-tiktok { background: #b33b5c; color: #fde7ed; }
    .cat-adult { background: #8b2f4a; color: #f8e3e8; }
    .cat-social { background: #4f6f8f; color: #e3edf5; }
    .cat-other { background: #3d4a5c; color: #e4e9f0; }
    .filter-btn { background: #1f2a3a; color: #a7b6cf; border: 1px solid #2f3b4f; transition: 0.1s ease; }
    .filter-btn.active { background: #2f4b7a; color: white; border-color: #4a7ab5; }
    .filter-btn:hover { background: #2a3a52; color: #e2eaf5; }
    .fade-row { transition: opacity 0.2s ease, transform 0.2s ease; }
    .table-wrap { overflow-x: auto; }
    .quick-btn {
      padding: 0.6rem 0.8rem; font-size: 0.85rem; font-weight: 500; border-radius: 1rem;
      transition: all 0.1s ease; text-align: center; min-width: 80px; flex: 1 0 auto;
      border: 1px solid transparent;
    }
    .quick-btn:active { transform: scale(0.94); }
    .quick-btn i { margin-right: 6px; }
    @media (max-width: 500px) { .quick-btn { font-size: 0.7rem; padding: 0.5rem 0.4rem; min-width: 60px; } }
    /* sync status dot */
    .sync-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .sync-online { background: #4ade80; box-shadow: 0 0 8px #4ade8066; }
    .sync-offline { background: #f87171; box-shadow: 0 0 8px #f8717166; }
    .sync-syncing { background: #facc15; box-shadow: 0 0 8px #facc1566; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 md:py-10 text-slate-200">

  <!-- Header with sync status -->
  <header class="flex flex-wrap items-center justify-between mb-6 gap-2">
    <div>
      <h1 class="text-2xl md:text-3xl font-semibold tracking-tight flex items-center gap-2 text-white">
        <i class="fas fa-brain text-indigo-400"></i> Focus<span class="text-indigo-300">/</span>track
      </h1>
      <p class="text-slate-400 text-sm mt-0.5">zero‑friction · private · cloud sync</p>
    </div>
    <div class="flex items-center gap-3">
      <div id="syncStatus" class="text-xs text-slate-400 bg-[#141a26] px-3 py-1.5 rounded-full border border-[#2a3344] flex items-center">
        <span class="sync-dot sync-offline" id="syncDot"></span>
        <span id="syncLabel">offline</span>
      </div>
      <div class="text-sm text-slate-400 bg-[#141a26] px-4 py-1.5 rounded-full border border-[#2a3344] flex items-center gap-2">
        <i class="far fa-clock text-indigo-300"></i> <span id="liveClock" class="font-mono text-slate-300"></span>
      </div>
    </div>
  </header>

  <!-- QUICK LOG SECTION -->
  <section class="card-dark rounded-2xl p-4 md:p-5 mb-7">
    <div class="flex flex-wrap items-center gap-1.5 mb-3">
      <span class="text-xs font-medium text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fas fa-bolt text-amber-400"></i> 1‑click log
      </span>
      <span class="text-[10px] text-slate-500 ml-1">(tap button → instant)</span>
    </div>
    <div class="flex flex-wrap gap-2 mb-3" id="quickBtnGroup">
      <button class="quick-btn cat-telegram" data-cat="Telegram Notifications"><i class="fab fa-telegram"></i> Telegram</button>
      <button class="quick-btn cat-tiktok" data-cat="TikTok / Short Videos"><i class="fab fa-tiktok"></i> TikTok</button>
      <button class="quick-btn cat-adult" data-cat="Adult Content / Pornography"><i class="fas fa-ban"></i> Adult</button>
      <button class="quick-btn cat-social" data-cat="Social Media / Browsing"><i class="fas fa-globe"></i> Social</button>
      <button class="quick-btn cat-other" data-cat="Other / Custom"><i class="fas fa-ellipsis"></i> Other</button>
    </div>
    <div class="flex flex-wrap items-center gap-2 mt-1">
      <div class="flex-1 min-w-[140px]">
        <input id="detailInput" type="text" placeholder="Optional note (e.g. 'scrolled 15m')" class="w-full bg-[#1a2433] border border-[#2f3b4f] rounded-xl px-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:ring-1 focus:ring-indigo-400 focus:outline-none">
      </div>
      <button id="logWithDetailBtn" class="bg-indigo-600 hover:bg-indigo-700 text-sm font-medium px-5 py-1.5 rounded-xl transition flex items-center gap-1.5 border border-indigo-400/30">
        <i class="fas fa-plus"></i> Log with note
      </button>
    </div>
    <p class="text-[10px] text-slate-500 mt-2 flex items-center gap-1"><i class="far fa-clock"></i> timestamp auto‑captured</p>
  </section>

  <!-- DASHBOARD -->
  <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-7">
    <div class="card-dark rounded-2xl p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-indigo-900/40 flex items-center justify-center text-indigo-300 text-lg"><i class="fas fa-list"></i></div>
      <div><p class="text-xs text-slate-400 font-medium">Today's interruptions</p><p id="totalToday" class="text-2xl font-bold text-white">0</p></div>
    </div>
    <div class="card-dark rounded-2xl p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber-900/30 flex items-center justify-center text-amber-300 text-lg"><i class="fas fa-crown"></i></div>
      <div><p class="text-xs text-slate-400 font-medium">Top distractor</p><p id="topDistractor" class="text-xl font-bold text-white truncate">—</p></div>
    </div>
    <div class="card-dark rounded-2xl p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-emerald-900/30 flex items-center justify-center text-emerald-300 text-lg"><i class="fas fa-stopwatch"></i></div>
      <div><p class="text-xs text-slate-400 font-medium">Focus streak (since last)</p><p id="focusStreak" class="text-xl font-bold text-white">—</p></div>
    </div>
  </section>

  <!-- LOG HISTORY + FILTERS -->
  <section class="card-dark rounded-2xl p-4 md:p-5">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h2 class="text-sm font-medium text-slate-300 uppercase tracking-wider flex items-center gap-2">
        <i class="fas fa-clock-rotate-left text-indigo-400"></i> History
      </h2>
      <div class="flex flex-wrap items-center gap-1.5">
        <button class="filter-btn active text-xs px-3 py-1 rounded-full" data-filter="all">All</button>
        <button class="filter-btn text-xs px-3 py-1 rounded-full" data-filter="Telegram Notifications">Telegram</button>
        <button class="filter-btn text-xs px-3 py-1 rounded-full" data-filter="TikTok / Short Videos">TikTok</button>
        <button class="filter-btn text-xs px-3 py-1 rounded-full" data-filter="Adult Content / Pornography">Adult</button>
        <button class="filter-btn text-xs px-3 py-1 rounded-full" data-filter="Social Media / Browsing">Social</button>
        <button class="filter-btn text-xs px-3 py-1 rounded-full" data-filter="Other / Custom">Other</button>
        <button id="clearAllBtn" class="text-xs bg-rose-900/40 hover:bg-rose-800/50 text-rose-200 px-3 py-1 rounded-full transition flex items-center gap-1 border border-rose-700/30 ml-1">
          <i class="fas fa-trash-can"></i> Clear
        </button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="w-full text-sm">
        <thead class="text-left text-xs text-slate-400 border-b border-[#2a3344]">
          <tr><th class="pb-2 pr-2 font-medium">Time</th><th class="pb-2 pr-2 font-medium">Category</th><th class="pb-2 pr-2 font-medium">Note</th><th class="pb-2 text-right font-medium">Action</th></tr>
        </thead>
        <tbody id="logTableBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="text-center text-slate-500 text-sm py-8">
      <i class="fas fa-inbox text-3xl block mb-2 text-slate-600"></i> No distractions logged. Stay in flow.
    </div>
  </section>
</div>

<script>
  (function($) {
    "use strict";

    // ============================================================
    //  🔥 FIREBASE CONFIGURATION — PASTE YOUR KEYS HERE
    // ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBma59s9-RLk5KTp1COwEzYWr_sWLRMMF4",
  authDomain: "productivity-4d09b.firebaseapp.com",
  projectId: "productivity-4d09b",
  storageBucket: "productivity-4d09b.firebasestorage.app",
  messagingSenderId: "260853498434",
  appId: "1:260853498434:web:4dc53b5e1873b3317e23db",
  measurementId: "G-R6M4Q8X9G5"
};

    // ============================================================

    // ---------- STATE ----------
    const STORAGE_KEY = 'focus_distraction_logs';
    const CATEGORY_MAP = {
      'Telegram Notifications': 'cat-telegram',
      'TikTok / Short Videos': 'cat-tiktok',
      'Adult Content / Pornography': 'cat-adult',
      'Social Media / Browsing': 'cat-social',
      'Other / Custom': 'cat-other'
    };

    let currentFilter = 'all';
    let logsCache = [];               // local copy
    let firestoreUnsubscribe = null;
    let isFirebaseReady = false;
    let db = null;

    // ---------- UI sync status ----------
    function setSyncStatus(state) {
      const dot = $('#syncDot');
      const label = $('#syncLabel');
      dot.removeClass('sync-online sync-offline sync-syncing');
      if (state === 'online') {
        dot.addClass('sync-online');
        label.text('synced');
      } else if (state === 'syncing') {
        dot.addClass('sync-syncing');
        label.text('syncing...');
      } else {
        dot.addClass('sync-offline');
        label.text('offline');
      }
    }

    // ---------- MODEL (local fallback) ----------
    function loadLocalLogs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) { return []; }
    }
    function saveLocalLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    // ---------- HELPERS ----------
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function isToday(iso) {
      const d = new Date(iso);
      const now = new Date();
      return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }
    function generateId() { return Date.now() + '_' + Math.random().toString(36).substring(2, 7); }

    function computeMetrics(logs) {
      const today = logs.filter(l => isToday(l.timestamp));
      const total = today.length;
      let freq = {}, maxCount = 0, top = '—';
      today.forEach(l => {
        freq[l.category] = (freq[l.category] || 0) + 1;
        if (freq[l.category] > maxCount) { maxCount = freq[l.category]; top = l.category; }
      });
      if (today.length === 0) top = '—';
      let streak = '—';
      if (logs.length > 0) {
        const sorted = [...logs].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        const last = new Date(sorted[0].timestamp);
        const diff = Math.floor((Date.now() - last.getTime()) / 60000);
        if (diff < 1) streak = '< 1 min';
        else if (diff < 60) streak = diff + ' min';
        else streak = Math.floor(diff/60) + 'h ' + (diff%60) + 'm';
      }
      return { total, top, streak };
    }

    // ---------- RENDER (from logsCache) ----------
    function renderAll() {
      const logs = logsCache;
      const sorted = [...logs].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      const metrics = computeMetrics(logs);
      $('#totalToday').text(metrics.total);
      $('#topDistractor').text(metrics.top);
      $('#focusStreak').text(metrics.streak);

      let filtered = sorted;
      if (currentFilter !== 'all') {
        filtered = sorted.filter(l => l.category === currentFilter);
      }

      const tbody = $('#logTableBody');
      tbody.empty();
      if (filtered.length === 0) {
        $('#emptyState').show();
      } else {
        $('#emptyState').hide();
        filtered.forEach((log) => {
          const catClass = CATEGORY_MAP[log.category] || 'cat-other';
          const timeStr = formatTime(log.timestamp);
          const note = log.note || '';
          const row = $(`
            <tr class="border-b border-[#1f2a3a] hover:bg-[#1a2433]/60 transition fade-row" data-id="${log.id}">
              <td class="py-2.5 pr-2 text-slate-400 text-xs whitespace-nowrap">${timeStr}</td>
              <td class="py-2.5 pr-2"><span class="badge-cat ${catClass}">${log.category}</span></td>
              <td class="py-2.5 pr-2 text-slate-300 max-w-[140px] truncate">${note || '—'}</td>
              <td class="py-2.5 text-right">
                <button class="deleteBtn text-slate-500 hover:text-rose-400 transition px-1.5 py-0.5" data-id="${log.id}"><i class="fas fa-trash-can"></i></button>
              </td>
            </tr>
          `);
          tbody.append(row);
        });
      }

      $('.deleteBtn').off('click').on('click', function(e) {
        e.stopPropagation();
        const id = $(this).data('id');
        deleteLogById(id);
      });
    }

    // ---------- CRUD (sync-aware) ----------
    function addLog(category, note) {
      const entry = {
        id: generateId(),
        timestamp: new Date().toISOString(),
        category: category,
        note: (note || '').trim() || ''
      };
      // optimistic local update
      logsCache.push(entry);
      saveLocalLogs(logsCache);
      renderAll();

      if (isFirebaseReady && db) {
        setSyncStatus('syncing');
        db.collection('distractions').doc(entry.id).set(entry)
          .then(() => { setSyncStatus('online'); })
          .catch(() => { setSyncStatus('offline'); });
      } else {
        setSyncStatus('offline');
      }
      $('#detailInput').val('');
    }

    function deleteLogById(id) {
      const logToDelete = logsCache.find(l => l.id === id);
      if (!logToDelete) return;
      logsCache = logsCache.filter(l => l.id !== id);
      saveLocalLogs(logsCache);
      renderAll();

      if (isFirebaseReady && db) {
        setSyncStatus('syncing');
        db.collection('distractions').doc(id).delete()
          .then(() => { setSyncStatus('online'); })
          .catch(() => { setSyncStatus('offline'); });
      } else {
        setSyncStatus('offline');
      }
    }

    function clearAllLogs() {
      if (logsCache.length === 0) return;
      if (!confirm('🧹 Delete all distraction logs permanently?')) return;
      const ids = logsCache.map(l => l.id);
      logsCache = [];
      saveLocalLogs(logsCache);
      renderAll();

      if (isFirebaseReady && db && ids.length > 0) {
        setSyncStatus('syncing');
        const batch = db.batch();
        ids.forEach(id => {
          const ref = db.collection('distractions').doc(id);
          batch.delete(ref);
        });
        batch.commit()
          .then(() => { setSyncStatus('online'); })
          .catch(() => { setSyncStatus('offline'); });
      } else {
        setSyncStatus('offline');
      }
    }

    // ---------- FIREBASE INIT & LISTENER ----------
    function initFirebase() {
      // check if config is filled (basic check)
      if (FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') {
        console.warn('⚠️ Firebase config not set. Using local storage only.');
        setSyncStatus('offline');
        return;
      }
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();

        // enable offline persistence (optional)
        db.enablePersistence({ synchronizeTabs: true })
          .catch((err) => { console.warn('Firestore persistence:', err); });

        isFirebaseReady = true;
        setSyncStatus('syncing');

        // realtime listener
        firestoreUnsubscribe = db.collection('distractions')
          .orderBy('timestamp', 'desc')
          .onSnapshot((snapshot) => {
            const remoteLogs = [];
            snapshot.forEach(doc => {
              const data = doc.data();
              if (data && data.id) {
                remoteLogs.push(data);
              }
            });
            // merge: use remote as source of truth, but keep local for offline edits?
            // We'll replace cache with remote data (since it's the source of truth)
            // But we want to avoid overwriting local changes that haven't synced?
            // For simplicity, we use remote as master.
            logsCache = remoteLogs;
            saveLocalLogs(logsCache);
            renderAll();
            setSyncStatus('online');
          }, (error) => {
            console.warn('Firestore listener error:', error);
            setSyncStatus('offline');
            // fallback to local
            logsCache = loadLocalLogs();
            renderAll();
          });

      } catch (e) {
        console.warn('Firebase init failed:', e);
        setSyncStatus('offline');
        logsCache = loadLocalLogs();
        renderAll();
      }
    }

    // ---------- EVENT BINDING ----------
    $(document).ready(function() {
      // initial load (local)
      logsCache = loadLocalLogs();
      renderAll();

      // Try Firebase
      initFirebase();

      // 1-click quick buttons
      $('#quickBtnGroup').on('click', 'button', function() {
        const cat = $(this).data('cat');
        if (cat) {
          const note = $('#detailInput').val().trim();
          addLog(cat, note);
          $('#detailInput').focus();
        }
      });

      // log with detail
      $('#logWithDetailBtn').on('click', function() {
        const note = $('#detailInput').val().trim();
        addLog('Other / Custom', note || 'manual log');
        $('#detailInput').focus();
      });

      // Filter
      $('.filter-btn').on('click', function() {
        $('.filter-btn').removeClass('active');
        $(this).addClass('active');
        currentFilter = $(this).data('filter') || 'all';
        renderAll();
      });

      // Clear all
      $('#clearAllBtn').on('click', function() {
        clearAllLogs();
      });

      // Live clock
      function updateClock() {
        const now = new Date();
        $('#liveClock').text(now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }
      updateClock();
      setInterval(updateClock, 1000);

      $('#detailInput').on('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          $('#logWithDetailBtn').click();
        }
      });

      // focus
      $('#detailInput').focus();
    });

  })(jQuery);
</script>
</body>
</html>
